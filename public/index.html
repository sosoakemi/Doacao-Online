<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doação Online - Transformando Vidas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="iconeDeImpacto"></div>
        <h1>Doação Online</h1>
        
        <form id="formularioDeDoacao">
            <div class="grupoFormulario">
                <label for="nome">Nome Completo</label>
                <div class="containerInput">
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
                </div>
            </div>
            
            <div class="grupoFormulario">
                <label for="email">E-mail</label>
                <div class="containerInput email">
                    <input type="email" id="email" name="email" placeholder="seu.email@exemplo.com" required>
                </div>
            </div>

            <div class="mensagemDeImpacto">
                <p><strong>Sua doação salva vidas.</strong> Cada contribuição nos permite expandir nossos programas de assistência e alcançar mais famílias em situação de vulnerabilidade.</p>
            </div>
            
            <button type="submit" class="botaoEnviar" id="botaoEnviar">
                Confirmar Doação
            </button>
        </form>
    </div>

    <!-- Modal de Sucesso -->
    <div class="mensagemDeSucesso" id="mensagemDeSucesso">
        <div class="cartaoDeAgradecimento">
            <button class="botaoFechar" id="botaoFechar">&times;</button>
            <div class="iconeDeAgradecimento">🎉</div>
            <div id="mensagemDeAgradecimento">
               
            </div>
        </div>
    
  <script src="script.js"></script>
</body>
</html>
