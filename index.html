<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doação Online - Transformando Vidas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
     <!-- Vídeo de fundo com pessoas sendo ajudadas -->
    <video class="video-background" autoplay muted loop>
        <source src="pessoas-ajudando.mp4" type="video/mp4">
        Seu navegador não suporta vídeo HTML5.
    </video>
    
    <!-- Overlay para controlar opacidade e contraste -->
    <div class="video-overlay"></div>

    <div class="container">
        <div class="impact-icon"></div>
        <h1>Doação Online</h1>
        <p class="subtitle">Transformando Vidas Através da Solidariedade</p>
        
        <div class="impact-stats">
            <h3>Seu Impacto em Números</h3>
            <div class="stats-grid">
                <div class="stat-item">
                    <span class="stat-number">12.847</span>
                    <span class="stat-label">Vidas Impactadas</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number">2.394</span>
                    <span class="stat-label">Doadores Ativos</span>
                </div>
            </div>
        </div>
        
        <form id="donationForm">
            <div class="form-group">
                <label for="nome">Nome Completo</label>
                <div class="input-container">
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
                </div>
            </div>
            
            <div class="form-group">
                <label for="email">E-mail</label>
                <div class="input-container email">
                    <input type="email" id="email" name="email" placeholder="seu.email@exemplo.com" required>
                </div>
            </div>

            <div class="impact-message">
                <p><strong>Sua doação salva vidas.</strong> Cada contribuição nos permite expandir nossos programas de assistência e alcançar mais famílias em situação de vulnerabilidade.</p>
            </div>
            
            <button type="submit" class="submit-btn" id="submitBtn">
                Confirmar Doação
            </button>
        </form>
    </div>

    <!-- Modal de Agradecimento -->
    <div class="success-message" id="successMessage">
        <div class="thank-you-card">
            <button class="close-btn" id="closeBtn">&times;</button>
            <div class="thank-you-icon">🎉</div>
            <div id="thankYouMessage">
                <!-- Conteúdo será inserido aqui pelo JavaScript -->
            </div>
        </div>
    </div>
  <script src="script.js"></script>
</body>
</html>
